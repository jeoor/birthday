name: Birthday blessing email

on:
  schedule:
    # 每年 1 月 29 日北京时间 00:00 发送一次。
    # 改 birthday.config.json 后同步本处“分 时 日 月”，再运行 pnpm cfg。
    - cron: '0 0 29 1 *'
      timezone: 'Asia/Shanghai'
  # 允许在 Actions 页面手动触发；勾选 force 可不看日期直接发送，方便随时测试。
  workflow_dispatch:
    inputs:
      force:
        description: '非生日也强制发送（测试用）'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  send-blessing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Send blessing email
        # 公开参数由 birthday.config.json 提供；密码只注入实际发送步骤。
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          BIRTHDAY_FORCE: ${{ inputs.force }}
        run: node scripts/send-birthday-email.mjs
